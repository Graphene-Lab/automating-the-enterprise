name: Release the books

# Written by DistroBook when the book was first prepared; edit it freely, it is only created when
# missing. The books are built into publish/ and tracked there, so the README can link to the files
# themselves; this release is the dated archive of a build.
#
# It runs when the built books change, not on every commit: a change under publish/ is by definition
# a new build. The tag carries the day and the commit, so two builds in one day never collide and a
# release always names the commit that produced it.

on:
  push:
    branches: [main]
    paths:
      - 'publish/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-books
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit that carries the books
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Work out the tag
        id: tag
        run: |
          echo "tag=books-$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Collect the books
        run: |
          # nullglob: a book without print interiors must not pass a literal 'publish/print/*.pdf'
          # to gh, which would then fail on a file that does not exist.
          shopt -s nullglob
          assets=(publish/*.pdf publish/*.epub publish/print/*.pdf)
          test ${#assets[@]} -ge 2 || { echo "publish/ holds no books: nothing to release"; exit 1; }
          printf '%s\n' "${assets[@]}" > assets.txt
          sed 's/^/  /' assets.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          day="${{ steps.tag.outputs.day }}"
          short="${GITHUB_SHA::7}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists: nothing to publish"
            exit 0
          fi

          # The notes list what was attached, read from the files themselves, so a book that gains a
          # language later does not need this file changed.
          {
            echo "The books built from the sources in \`books/\` at commit $short."
            echo
            echo "| File | Size |"
            echo "|---|---|"
            while IFS= read -r f; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done < assets.txt
          } > notes.md

          mapfile -t files < assets.txt
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Books of $day ($short)" \
            --notes-file notes.md \
            "${files[@]}"